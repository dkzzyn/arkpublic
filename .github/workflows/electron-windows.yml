name: Electron Windows (.exe)

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-installer:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: w
    steps:
      # Clone em subpasta curta (GITHUB_WORKSPACE/w) para limitar tamanho dos caminhos no build.
      - uses: actions/checkout@v4
        with:
          path: w

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: w/package-lock.json

      - name: Instalar dependências Node (raiz + frontend)
        run: |
          npm install
          npm --prefix ./frontend install

      - name: Preparar backend portátil (Python embeddable + deps)
        run: node scripts/setup-backend-runtime-windows.js

      - name: Gerar instalador NSIS (.exe)
        run: npm run frontend:build && npx electron-builder --win

      - name: Upload do instalador
        uses: actions/upload-artifact@v4
        with:
          name: ControleExpedicao-Windows-Setup
          path: w/electron-dist/*.exe
